<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1b222f"/>
      <stop offset="60%" stop-color="#10141b"/>
      <stop offset="100%" stop-color="#06080b"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="25%" stop-color="#F7DC6F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>

    <!-- Outer Ring Gold Gradient -->
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#553f10"/>
      <stop offset="100%" stop-color="#F7DC6F"/>
    </linearGradient>

    <!-- Wine Colors for Toast Mini-Icon -->
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="60%" stop-color="#b31237"/>
      <stop offset="100%" stop-color="#4a0413"/>
    </linearGradient>
  </defs>

  <!-- Background with Luxury Rounded Corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Ceremonial Circles -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Crown of Honor -->
  <g transform="translate(256, 125) scale(1.15)">
    <path d="M 0 -35 L 20 -5 L 45 -22 L 35 15 L -35 15 L -45 -22 L -20 -5 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-42" r="5" fill="#FFF8DC"/>
    <circle cx="-48" cy="-28" r="4.5" fill="#FFF8DC"/>
    <circle cx="48" cy="-28" r="4.5" fill="#FFF8DC"/>
  </g>

  <!-- 57 Golden Typography -->
  <text x="256" y="305" font-family="'Cinzel', Georgia, serif" font-size="155" font-weight="900" text-anchor="middle" fill="url(#goldGrad)">57</text>
  <text x="256" y="360" font-family="'Montserrat', sans-serif" font-size="26" font-weight="700" letter-spacing="14" text-anchor="middle" fill="#F7DC6F">AÑOS</text>

  <!-- Clinking Wine Glasses Emblem at Bottom -->
  <g transform="translate(256, 420) scale(0.65)">
    <!-- Left Glass -->
    <g transform="rotate(-12) translate(-30, 0)">
      <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="url(#goldGrad)"/>
      <line x1="0" y1="20" x2="0" y2="45" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M -16 -20 C -16 10, -5 20, 0 20 C 5 20, 16 10, 16 -20 Z" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>
    <!-- Right Glass -->
    <g transform="rotate(12) translate(30, 0)">
      <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="url(#goldGrad)"/>
      <line x1="0" y1="20" x2="0" y2="45" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M -16 -20 C -16 10, -5 20, 0 20 C 5 20, 16 10, 16 -20 Z" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>
    <!-- Sparkle -->
    <circle cx="0" cy="-5" r="4" fill="#FFF8DC"/>
  </g>
</svg>